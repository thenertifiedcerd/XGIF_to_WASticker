<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X GIF to WhatsApp Sticker</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="card">
      <h1>Turn an X GIF into a WhatsApp sticker</h1>
      <p class="intro">Paste a public X post URL. The result is padded to 512 × 512 and compressed below 500 KB.</p>
      <form id="convert-form">
        <label for="url">X post URL</label>
        <div class="row">
          <input id="url" name="url" type="url" placeholder="https://x.com/user/status/123" required>
          <button type="submit">Convert</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <a id="download" class="download" hidden>Download sticker</a>
    </main>
    <script src="config.js"></script>
    <script>
      const form = document.querySelector('#convert-form');
      const status = document.querySelector('#status');
      const download = document.querySelector('#download');
      const apiBaseUrl = (window.APP_CONFIG?.apiBaseUrl || '').replace(/\/$/, '');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        status.textContent = 'Downloading and converting…';
        download.hidden = true;
        const button = form.querySelector('button');
        button.disabled = true;
        try {
          const response = await fetch(`${apiBaseUrl}/api/convert`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: form.url.value })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Conversion failed.');
          status.textContent = `Ready (${Math.round(result.size / 1024)} KB).`;
          download.href = result.downloadUrl.startsWith('http')
            ? result.downloadUrl
            : `${apiBaseUrl}${result.downloadUrl}`;
          download.hidden = false;
        } catch (error) {
          status.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
